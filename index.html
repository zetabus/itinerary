  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --border: #2d3742;
    --accent: #4a9eff;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --computed: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    color: var(--text);
    padding: 12px;
  }

    font-size: 18px;
    margin: 4px 0 12px 0;
    font-weight: 600;
  }
  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 720px;
  }
  th {
    background: var(--panel);
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  td {
    padding: 5px 6px;
    border-bottom: none;
    vertical-align: top;
  }
  tr.land-row td {
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  tr.dep-row td {
    padding-top: 8px;
  }
  td.leg-num, td[rowspan="2"] {
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
  }
